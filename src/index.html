<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Money tracker</title>
        <link rel="stylesheet" href="styles/basic.css" type="text/css">
        <link rel="stylesheet" href="styles/polish.css" type="text/css">
    </head>
    <body>
        <main>
            <header class="globalHeader">
                <h1>Money Tracker</h1>
                <button id="historyBtn" class="historyBtn"><img src="assets/history-icon.webp" alt="History" width="40" height="40"></button>
            </header>
            <section id="homePage" class="page homePage active-page">
                <header>
                    <p id="globalBalanceAmount">Balance: $0</p>
                </header>
                <button id="transactionBtn" class="transactionBtn">Add transaction</button>
            </section>
            <section id="transactionPage" class="page transactionPage" inert>
                <header>
                    <h2>Add a new transaction</h2>
                </header>
                <div class="transactionDetails">
                    <label for="transactionTypeField">Type:</label>
                    <div class="selectWrapper">
                        <select name="transactionType" id="transactionTypeField">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <label for="transactionAmountField">Amount:</label>
                    <input type="text" name="transactionAmount" id="transactionAmountField">
                </div>
                <div class="transactionBtns">
                    <button id="confirmBtn" class="confirmBtn">Confirm</button>
                    <button id="deleteBtn" class="deleteBtn">Delete</button>
                </div>
                <div class="errorMessageContainer" id="errorMessageContainer" hidden></div>
                <button id="closeTransactionBtn" class="closePageBtn"><img src="assets/close-icon.webp" alt="History" width="40" height="40"></button>
            </section>
            <section id="historyPage" class="page historyPage" inert>
                <header>
                    <h2>History</h2>
                </header>
                <div id="transactionHistory" class="transactionHistory"></div>
                <button id="closeHistoryBtn" class="closePageBtn"><img src="assets/close-icon.webp" alt="History" width="40" height="40"></button>
            </section>
            <section id="manualUpdatePage" class="page manualUpdatePage" inert>
                <header>
                    <h2>Update balance manually</h2>
                </header>
                <div class="manualUpdateDetails">
                    <label for="manualUpdateAmountField">Amount:</label>
                    <input type="text" name="manualUpdateAmount" id="manualUpdateAmountField">
                    <button id="manualUpdateConfirmBtn" class="manualUpdateConfirmBtn">Confirm</button>
                </div>
                <button id="closeManualUpdateBtn" class="closePageBtn"><img src="assets/close-icon.webp" alt="History" width="40" height="40"></button>
            </section>
        </main>
        <script src="scripts/main-new.js"></script>
    </body>
</html>
